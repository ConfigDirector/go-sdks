name: go-sdks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The checks themselves live in the Makefile so that CI and the pre-push hook cannot drift
# apart. bash everywhere keeps the make recipes portable across the runner images.
defaults:
  run:
    shell: bash

env:
  # Never download another toolchain: each job runs on exactly the Go version it names, so a
  # go directive above the oldest supported release fails here instead of being papered over.
  # check-latest makes every job run the newest patch of that version: the runner image's cached
  # Go lags a patch release by days, and govulncheck reports the standard library of the Go that
  # runs it, so the hardening job would otherwise fail on vulnerabilities a released patch fixed.
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - run: make verify-tidy
      - run: make lint
      - run: make test-release-preflight

  test:
    name: Test (Go ${{ matrix.go }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest release the Go team still supports (the go directive in go.work) and the
        # current one.
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"

      - run: make test-race

  hardening:
    name: Vulnerabilities and fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      # govulncheck also scans the standard library of the Go that runs it, so this job fails
      # from the day a vulnerability is published for the Go release it runs until the patch
      # release that fixes it, which check-latest picks up as soon as it exists.
      - run: make vulncheck
      - run: make fuzz

  samples:
    name: Sample apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      # Each sample is a module outside go.work. The first run checks them against the released
      # modules their go.mod names, as an application builds them; the second against the modules
      # in this working tree, which is what catches a breaking API change before it ships.
      - run: make samples
      - run: make samples-local
